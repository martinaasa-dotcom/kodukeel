name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the whole suite by hand against any ref, from the Actions tab.
  #
  # A pull request opened by a GitHub App does not create a workflow run: the
  # events an installation token generates are not allowed to trigger one, and
  # the result is a PR with no CI at all rather than a red one, which is the
  # harder thing to notice. This is the way back in. It needs write access to
  # invoke, it takes no inputs, and it runs exactly the jobs below, so it
  # widens who can start CI and not what CI can reach.
  #
  # GitHub only offers a workflow for dispatch once the trigger is on the
  # default branch, so this does nothing until it lands on main. After that it
  # covers every branch, including any this one cannot reach today.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholders only. Real keys stay on the deployment; nothing here maps a
# repository secret into a job, so a workflow file cannot become a way to read
# one. The build job brings up its own Postgres beside it.
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # Prisma's client is generated, so `tsc` has nothing to check against
      # until it exists. It needs no database to be generated.
      - run: npx prisma generate
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      # The database-backed tests skip themselves without a connection, which
      # is deliberate: the pure modules are the ones worth running on every
      # push, and they run in about eight seconds.
      - run: npm test

  questions:
    name: No question prints its own answer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # No database and no key: it reads prisma/data/expanded.json, which is
      # what `npm run db:seed` loads, and builds every card, paper and clue the
      # app can make out of it.
      #
      # Here rather than in the drift workflow, because this is a fact about
      # our own code rather than about anything upstream: the generators are
      # each correct on the word a fixture picks and wrong on a handful
      # somewhere in five thousand, which is the one shape no unit test can
      # see. It found four separate faults the day it was written, one of them
      # in the rule that had been written to fix the first three.
      #
      # 44,818 questions in about ninety seconds, most of it the deck.
      # Prisma 7 will not let the client be *imported* before it is generated:
      # `@prisma/client` resolves to a stub whose `default.js` requires the
      # generated output, so a script that only reads `expanded.json` still dies
      # on MODULE_NOT_FOUND for reaching `lib/db.ts` through an import chain. On
      # 6 the stub imported cleanly and threw only on use, which is why this
      # step was never needed here.
      - run: npx prisma generate
      - run: npm run audit:questions
      # And the question after it: not "is the answer printed in the question"
      # but "would anybody ask this question about this word". It reads the
      # same file and needs nothing else, and it found six faults the day it
      # was written, the first of them reported by a learner who was drilled on
      # the illative of a horse. Seconds, because it builds no papers.
      - run: npm run audit:sense

  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # This is the whole reason the suite will stay green. Upside Lab kept
      # one like it that nothing ran, and it drifted to twenty-three failures
      # behind a rename, a design pass and a navigation rework before anybody
      # counted. A check nothing runs reports on the code it was written
      # against, not the code you have. It takes about a second.
      - run: npm run test:invariants

  secrets:
    name: No credential in the client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx prisma generate
      # Built with a key-shaped value in every server-only variable. If any of
      # them reaches the browser bundle, the grep below finds it. This is the
      # check CLAUDE.md has always said CI does; until now nothing did.
      #
      # ONE MARKER PER VARIABLE, because the failure has to name which leaked.
      # Every one of these was the same string, so the grep could only say that
      # *something* had; the marker carries the variable's own name now and the
      # failure prints it. The list is the whole server-only inventory rather
      # than the seven somebody remembered: `GROQ_API_KEY` and `GEMINI_API_KEY`
      # joined the provider chain and this did not follow them, `METRICS_TOKEN`
      # gates a route, and an error webhook's path is a common place to keep a
      # token. `scripts/test-invariants.ts` reads `PROVIDER_KEY_ENV` and checks
      # it against this list, so the next provider cannot be missed the same way.
      # A second check there reads the list by shape rather than by inventory:
      # a variable ending in KEY, TOKEN, SECRET or PASSWORD, read anywhere Next
      # builds, has to be here. That is what covers the ones no chain declares,
      # `METRICS_TOKEN` and `RESEARCH_TOKEN` among them.
      - name: Build with marked secrets
        env:
          CI_CANARY: canary-CI_CANARY-must-not-ship
          DATABASE_URL: postgresql://ci:canary-DATABASE_URL-must-not-ship@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:canary-DIRECT_URL-must-not-ship@127.0.0.1:5432/ci
          ANTHROPIC_API_KEY: canary-ANTHROPIC_API_KEY-must-not-ship
          OPENAI_API_KEY: canary-OPENAI_API_KEY-must-not-ship
          GROQ_API_KEY: canary-GROQ_API_KEY-must-not-ship
          GEMINI_API_KEY: canary-GEMINI_API_KEY-must-not-ship
          EKILEX_API_KEY: canary-EKILEX_API_KEY-must-not-ship
          SUPABASE_SERVICE_ROLE_KEY: canary-SUPABASE_SERVICE_ROLE_KEY-must-not-ship
          METRICS_TOKEN: canary-METRICS_TOKEN-must-not-ship
          RESEARCH_TOKEN: canary-RESEARCH_TOKEN-must-not-ship
          RESEND_API_KEY: canary-RESEND_API_KEY-must-not-ship
          EMAIL_TOKEN_SECRET: canary-EMAIL_TOKEN_SECRET-must-not-ship
          CRON_SECRET: canary-CRON_SECRET-must-not-ship
          RESEND_WEBHOOK_SECRET: canary-RESEND_WEBHOOK_SECRET-must-not-ship
          ERROR_WEBHOOK_URL: https://example.invalid/canary-ERROR_WEBHOOK_URL-must-not-ship
        run: npx next build
      - name: Grep the client bundle
        run: |
          if grep -rEho "canary-[A-Z_]+-must-not-ship" .next/static | sort -u > /tmp/leaked && [ -s /tmp/leaked ]; then
            echo "::error::A server-only value reached the client bundle: $(tr '\n' ' ' < /tmp/leaked)"
            exit 1
          fi
          echo "No server-only key in .next/static."
      # The same grep against the shapes a real key takes, in case one is
      # pasted into source rather than read from the environment.
      - name: Grep for key-shaped literals
        run: |
          if grep -rEl "sk-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9-]{20,}|sk-or-v1-[A-Za-z0-9]{20,}" .next/static; then
            echo "::error::Something key-shaped is in the client bundle."
            exit 1
          fi
          echo "Nothing key-shaped in .next/static."
      # The same sweep, widened: server chunks as well as static, AWS and Google
      # key shapes, a Postgres URL carrying a password, and — the one a grep for
      # "sk-" cannot see — a Supabase service_role JWT, told apart from the anon
      # key that is public by design by decoding the role claim.
      - name: Scan every built file for credential shapes
        run: npm run check:secrets

  build:
    name: Build against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        # Without this the job runs `prisma db push` before the server is
        # listening and fails on the connection rather than on anything it
        # was asked to check.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # THE ONE JOB THAT WRITES NEXT'S BUILD CACHE, and the others restore it.
      #
      # Five browser shards, this job, the load check and the credential scan
      # all run `next build`, which without a warm `.next/cache` is eight cold
      # builds of the same tree. Saving from one job rather than all of them
      # is what stops eight of them racing to write the same key and logging a
      # conflict apiece; the rest use `actions/cache/restore`.
      - name: Next's build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-
      # The real deploy command: generate, push the schema, seed the
      # dictionary if it is empty, then build. Running the whole thing here is
      # what catches a migration that cannot be applied or a seed that cannot
      # be loaded, which are the two ways a deploy fails after a green CI.
      - run: npm run build
      # The database-backed tests have a database now, so they no longer skip.
      - run: npm test
      # And the ones that only exist to check claims about the database:
      # replay idempotency, that a review outlives its card, that a restore in
      # replace mode leaves the log alone, and that deleting an account leaves
      # nothing of that person behind.
      - run: npm run test:db

  browser:
    name: Browser suites · ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    # A shard rather than the whole list, so this is a ceiling on one of five
    # rather than on all of them. The old single job ran to 27 minutes against
    # a 30-minute limit, which is an intermittent red for everybody.
    timeout-minutes: 20

    # ONE RUNNER PER SHARD, BECAUSE THE WALL CLOCK WAS THE WHOLE LIST IN A ROW.
    #
    # Twenty-seven browser suites ran one after another in one job, and the
    # measurement that ended that arrangement is worth writing down: on
    # 2026-09-19 the setup, the browser download and the build were 177
    # seconds, and the suites after them were about 24 minutes, of which
    # `test-containment.mjs` alone was 231 seconds. The job was at its own
    # ceiling, which is where the sign-in suite was moved out from and is not
    # a number to raise again.
    #
    # Nothing about a suite makes it need the one before it: each of these
    # opens a browser against a server on 127.0.0.1 and asks the app
    # questions. What they share is a database, and a shard brings up its own
    # Postgres, its own seed and its own fixture, so sharing stops being a
    # constraint across shards and stays one inside them. Splitting the list
    # five ways costs five builds and buys the wall clock back: the slowest
    # shard is what CI now takes.
    #
    # The two ordering rules that were load-bearing are kept, and both are
    # structural now rather than positional. A suite that has to see an empty
    # deck goes in `before`, which runs in its own step above the fixture, so
    # it cannot drift under it by somebody tidying the lines together. And
    # `test-restore.mjs` empties the dictionary and rebuilds it with no SEED
    # row, so it is last in its shard and nothing else is in that shard after
    # it. `scripts/test-invariants.ts` asserts both against this file.
    #
    # `fail-fast: false`, because five shards reporting is five answers and
    # the first failure cancelling the rest is one.
    strategy:
      fail-fast: false
      matrix:
        shard:
          # FIRST RUN, WHICH IS THE ONE STATE A FIXTURE ENDS.
          #
          # `/start` redirects anyone carrying `onboardedAt` or a single card,
          # so the demo deck closes that door: sixteen of `test-assess.mjs`'s
          # forty-two checks were waived on every run this ever had, honestly
          # reported, under the half that fails a suite outright, and
          # therefore silent. `test-first-day.mjs` is the same state from the
          # other side, every route in the app against a learner with no
          # history, which is the branch every panel derived from a review log
          # takes and which nothing rendered until it existed.
          - name: first run, then the phone
            before: >-
              scripts/test-first-day.mjs
              scripts/test-assess.mjs
            # Then the broadest walk, which is also the only one that opens the
            # navigation and asks whether every place in it is reachable, the
            # phone measured at four widths, the palette measured for contrast
            # in both themes, and the security controls asked of the running
            # server rather than read off the source.
            suites: >-
              scripts/smoke-new.mjs
              scripts/test-mobile.mjs
              scripts/test-design.mjs
              scripts/test-security.mjs

          # THE LONGEST SUITE THERE IS, WITH ROOM AROUND IT.
          #
          # `test-containment.mjs` opens every route at three widths and again
          # in the dark, then does it all a second time with every run of text
          # swapped for one of the same length that cannot break. It is four
          # minutes on its own and there is no honest way to make it less
          # without measuring less, so it gets a shard with one short suite
          # beside it rather than being hurried.
          - name: text inside its box
            suites: >-
              scripts/test-containment.mjs
              scripts/test-polish.mjs

          - name: the rounds
            suites: >-
              scripts/e2e.mjs
              scripts/test-modes.mjs
              scripts/test-teaching.mjs
              scripts/a11y-check.mjs

          # The paths that cross a process boundary: a photograph to a card, a
          # paper sat and marked, a report accepted into the shared
          # dictionary, a conversation played through, an evening of the
          # module walked. Each is a loop no unit test can see the whole of.
          - name: paper, papers and conversations
            suites: >-
              scripts/test-scan.mjs
              scripts/test-flash.mjs
              scripts/test-exam.mjs
              scripts/test-suggestions.mjs
              scripts/test-scene.mjs
              scripts/test-module.mjs

          # The suites that write, in the order they can be run in. The
          # calendar and the deck shelves add rows and take them off again;
          # the hint ladder and the offline outbox both grade, so they come
          # after the ones that want the fixture as it was; and the backup is
          # last, for the reason its own comment gives.
          - name: what writes, and the backup last
            suites: >-
              scripts/test-calendar.mjs
              scripts/test-decks.mjs
              scripts/smoke-interact.mjs
              scripts/test-edit.mjs
              scripts/test-rename.mjs
              scripts/test-hints.mjs
              scripts/smoke-offline.mjs
              scripts/test-error.mjs
              scripts/test-restore.mjs

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DEMO_OWNER_ID: local-single-user
      BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Next keeps its own build cache here, and five shards each building the
      # same tree is five cold builds without it. Restore only: the `build`
      # job is the one that writes it, so five jobs do not race to save the
      # same key. A miss costs exactly what this always cost.
      - name: Next's build cache, from the last run
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-
      - run: npm run build
      # A shell loop rather than a `wait-on` dependency: this is the only
      # place anything would wait for a port, and it is four lines.
      - name: Start the server
        # A provider key has to be *present* or the scan page correctly offers
        # no camera. It may be nonsense: scripts/test-scan.mjs intercepts the
        # route it would authenticate, so no request ever leaves the runner.
        env:
          GROQ_API_KEY: stubbed-by-the-test
        run: |
          npm start &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          echo "::error::The server never came up."
          exit 1
      # AGAINST AN EMPTY DECK, AND ONLY EVER HERE. A step of its own rather
      # than a position in the list below, so the rule survives somebody
      # tidying the two together.
      - name: The suites that need a deck with nothing in it
        # Four of the five shards declare no `before` at all, and a missing key
        # is `null` here rather than an error. GitHub casts both sides of a
        # comparison to a number, and `null` and `""` are both 0, so this is
        # false for them and the step is skipped.
        if: matrix.shard.before != ''
        run: |
          for suite in ${{ matrix.shard.before }}; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
      # A deck with something in it, so the review screen has cards and the
      # phone bar has a page under it to scroll.
      - run: npx tsx scripts/demo-data.ts
      # Every suite declares a floor, so one that dies early or quietly stops
      # running a block fails here rather than printing nothing and being read
      # as a pass. See scripts/lib/checks.mjs. `-e` is the default shell here,
      # so the first suite to fail ends the step and names itself.
      - name: This shard's suites
        run: |
          for suite in ${{ matrix.shard.suites }}; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
  signin:
    name: The sign-in screen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ITS OWN JOB, AND THAT IS ABOUT TIME RATHER THAN TIDINESS.
    #
    # `scripts/test-signin.mjs` needs a build of its own, because whether this
    # app gates every route or runs as one local learner is decided when the
    # bundle is built: `NEXT_PUBLIC_` variables are inlined, so a server told
    # to forget them still gates every route. Every other browser suite runs
    # against a local-mode build, which is why the hosted sign-in screen had
    # no coverage at all.
    #
    # It first ran as one more step inside the browser suites, which were one
    # job then and already the longest at about fifteen minutes. Adding a full
    # `next build` to the end of it, on a runner that is simultaneously
    # serving the app and driving Chromium, took that job past its
    # thirty-minute ceiling. A job permanently at its limit is an
    # intermittent red for everybody, and the fix is not a bigger number.
    #
    # Here the build runs beside the other jobs rather than after fifteen
    # minutes of suites, so the wall clock of CI does not move. The browser
    # suites are five shards now and this could be a sixth, and it is not:
    # a shard restores the seed and builds in local mode, and this one has to
    # build in hosted mode into a distDir of its own, which is a different
    # job however it is spelled.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The schema and the dictionary, but not a build: the suite makes its
      # own, in hosted mode and into its own distDir, which is the whole
      # reason it is a separate job.
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run db:seed:ensure
      - run: node scripts/test-signin.mjs

  load:
    name: The derived queries, at a size somebody reaches
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Next's build cache, from the last run
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-
      - run: npm run build
      # Progress is derived from the whole review log on every request
      # (ADR-014), so the only honest place to measure it is a log the size one
      # actually becomes. The demo deck is 417 reviews and would report a
      # missing index as fast.
      - name: Write a year of history for forty learners
        run: npx tsx scripts/load-fixture.ts --learners 40 --reviews 5000
      # Budgets, not records: this fails when a query goes over, and the number
      # to fix is the query rather than the budget. See docs/15-performance.md.
      #
      # Through `tsx`, which is what `npm run test:load` has always used and
      # what this step needs: the script imports the progress functions
      # themselves, and those import each other through the `@/lib` alias,
      # which plain `node` cannot resolve. It threw on the first import,
      # before check one.
      - run: npm run test:load -- --budget-only

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm }
      - run: npm ci
      # Read every advisory in the whole tree, out loud, whether or not it
      # blocks. This step never fails: it is the record.
      - name: Every advisory, dev included
        run: npm audit || true
      # THE GATE IS `high`, AND IT GOT THERE BY THE CHAIN BEING CLEARED
      # RATHER THAN BY THE BAR BEING MOVED.
      #
      # It was `high` on the first run of this workflow and failed, on five
      # advisories, and stopped at `critical` with the argument that no change
      # in this repository could clear them and that a blocking check which
      # cannot pass is the one people learn to click past. The first half of
      # that was wrong, and the note said so itself by naming the fix as
      # next@16: both chains are resolved by `overrides` in package.json, and
      # neither needs a major upgrade.
      #
      #   postcss. Every other consumer in the tree was already on the patched
      #   8.5.26 and only Next's own pin held 8.4.31, so one override deduped
      #   it onto what was already installed. The proof it changed nothing is
      #   the build output: Next names a stylesheet by the hash of its
      #   contents, and it is the same file, 313a9df4d86383e6.css, to the byte.
      #
      #   deepmerge-ts, reached through @prisma/config. Overridden to 8.0.2,
      #   and `prisma generate`, `prisma db push` and the seed all run.
      #
      # `npm audit --omit=dev` reports zero. Dev-only advisories used to be
      # read by the step above and left to it, because they do not ship.
      #
      # THEY NOW BLOCK TOO, AND AGAIN BY THE CHAIN BEING CLEARED RATHER THAN
      # THE BAR BEING MOVED. There were five, up to critical, all of them in
      # the vitest -> vite -> esbuild chain: a dev server that accepts requests
      # from any website, a path traversal, an fs.deny bypass. None of it ships
      # and "0 vulnerabilities" was true of the built app, which is exactly why
      # it was worth saying out loud that it was not true of a contributor's
      # machine while `npm run dev` or a watch run was up. A minor upgrade to
      # vitest 3 cleared all five, with the whole unit and integration suite
      # green on it and no change to a single test.
      #
      # Two gates rather than one, on purpose: the first is the promise about
      # what is deployed and must never be relaxed, the second is the promise
      # about what a contributor runs. If either cannot pass, fix the
      # dependency or say here, in writing, why it is unreachable. Do not lower
      # a number.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      # THE OTHER SUPPLY CHAIN QUESTION, WHICH `npm audit` HAS NO OPINION ON.
      #
      # A licence is the thing nobody thinks to check until the answer is
      # already in the tree and shipped. This project's code is MIT and its
      # built dictionary carries Wiktionary's CC BY-SA 4.0, and `LICENSE` says
      # exactly that; a strong copyleft *code* dependency arriving through a
      # transitive bump would quietly make that file wrong.
      #
      # `actions/dependency-review-action` was the obvious answer, went in, and
      # failed on every pull request: "Dependency review is not supported on
      # this repository. Please ensure that Dependency graph is enabled." That
      # is a setting in a dashboard, and a check whose precondition is a step
      # outside the repository is a check that does not run. The script asks
      # the same question with nothing to switch on, walks the whole production
      # tree rather than a diff, and a clone can run it.
      - run: node scripts/check-licences.mjs
